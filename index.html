<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deen Files — Privacy</title>
  <meta name="description" content="Privacy policy for Deen Files, an Android file manager and cloud drive by Deenmate.">
  <style>
    :root { color-scheme: dark; --bg:#04150f; --panel:#0a241b; --text:#e8f5ee; --muted:#9fb8aa; --gold:#e7c873; --green:#34d399; --line:#1d4233; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
      background: radial-gradient(900px 460px at 50% -10%, #0e3f2d 0%, transparent 62%), var(--bg);
      color: var(--text); font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    main { max-width: 560px; text-align: center; }
    img { width: 132px; height: 132px; border-radius: 30px; box-shadow: 0 24px 70px rgba(0,0,0,.45); }
    h1 { font-size: clamp(2rem, 6vw, 2.8rem); margin: 24px 0 10px; letter-spacing: -.4px; }
    p { color: var(--muted); margin: 0 auto 26px; }
    a { color: var(--green); text-decoration: none; }
    a:hover { color: var(--gold); }
    .btn {
      display: inline-flex; padding: 13px 22px; border-radius: 999px; font-weight: 700;
      background: linear-gradient(180deg, #e9cf82, #c9a84e); color: #17251d;
    }
    footer { margin-top: 40px; padding-top: 18px; border-top: 1px solid var(--line); color: var(--muted); font-size: .92rem; }
  </style>
</head>
<body>
  <main>
    <img src="play-store-icon-512.png" alt="Deen Files logo">
    <h1>Deen Files</h1>
    <p>A private file manager and cloud drive by Deenmate. Your files stay in your own Telegram channel.</p>
    <a class="btn" href="privacy.html">Read the privacy policy</a>
    <footer>© 2026 Deenmate · <a href="privacy.html">Privacy</a></footer>
  </main>
</body>
</html>
